services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aims_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aims_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  predict:
    build:
      context: .
      dockerfile: Dockerfile.predict
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  invoice-ocr:
    build:
      context: .
      dockerfile: Dockerfile.invoice-ocr
    environment:
      INVOICE_OCR_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5556/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 4000
      DATA_FILE: /app/backend/data/stock.json
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      PGDATABASE: aims_inventory
      PREDICT_SERVER: http://predict:5555
      INVOICE_OCR_SERVER: http://invoice-ocr:5556
      OWNER_USERNAME: ${OWNER_USERNAME:?Set OWNER_USERNAME in the root .env file}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      N8N_INBOUND_TOKEN: ${N8N_INBOUND_TOKEN:-}
      INVENTORY_OWNER_EMAIL: ${INVENTORY_OWNER_EMAIL:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - backend-data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
      predict:
        condition: service_healthy
      invoice-ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:
